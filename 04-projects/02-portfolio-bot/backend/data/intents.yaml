# intents.yaml
#
# Training utterances grouped by intent.
# Target: ~30 examples per intent, balanced (+- 5 between classes).
# All examples in English. Mix lengths, registers, and forms.
#
# Tip: write as 4 different visitors would — recruiter, dev, admission officer, casual peer.

intents:

  # Opening / first contact.
  greet:
    # TODO: ~30 examples like "hi", "hey there", "yo", etc.
    - "hi"
    - "hey there"
    - "yo"
    - "hello"
    - "salutations"
    - "greetings"
    - "what's up"
    - "how's it going"
    - "welcome"
    - "hii"
    - "hey"
    - "hi there"
    - "good morning"
    - "good afternoon"
    - "good evening"
    - "hiya"
    - "hey hey"
    - "hello there"
    - "heyy"
    - "helo"
    - "sup"
    - "oi"
    - "howdy"
    - "hey, quick question"
    - "hi, got a sec?"
    # Chinese greetings reflecting Auxance's language skills and future plans(hesteregg).
     #- "nǐ hǎo"
     #- "wèi"
     #- "nǐ hǎo ma?"
     #- "zǎo shang hǎo"
  about_him:
    - "who is Auxance"
    - "tell me about him"
    - "what is his background"
    - "where is he from"
    - "is he a student"
    - "what does he do"
    - "give me a quick introduction"
    - "who is this guy"
    - "tell me more about Auxance"
    - "is he French"
    - "what are his goals"
    - "what are his ambitions"
    - "what are his plans for the future"
    - "who's he"
    - "what's his story?"
    - "intro?"
    - "how old is he"
    - "could you describe his profile"
    - "what school is he at"
    - "who are you talking about"
    - "I just landed on this chat from his portfolio and I'd love to understand who he is, where he's coming from"

  current_focus:
    # TODO: ~30 examples like "what are you working on", "current focus", "what are you learning"
    - "what is his current project"
    - "what is he learning right now"
    - "what is his current focus"
    - "what is he working on"
    - "what are his current studies"
    - "where does he stand right now"
    - "current focus?"
    - "fill me in on his progress"
    - "catch me up on his journey"
    - "give me an update on his learning"
    - "tell me about his current studies"
    - "tell me what he's up to"
    - "actual focus?"
    - "he working on something right now?"
    - "he work on what right now?"
    - "he learn math?"
    - "he learn Python?"

  # The long-term picture: why AI, target school, the journey, motivation.
  ai_journey:
    - "what are his current studies plans"
    - "for what reason he want to do a doctorate in China"
    - "what school does he want to go to"
    - "what studies level does he want to reach"
    - "what's his long-term plan"
    - "describe his AI journey"
    - "what's his motivation for studying AI"
    - "how long has his AI journey been going"
    - "ai journey, tell me more"
    - "why is he doing all this"
    - "what's his long-term vision in AI"
    - "where is he headed"
    - "what's his target university"
    - "why china"
    - "why SJTU shanghai"
    - "where does he get his motivation from?"
    - "do you know if he has any personal story that explains his motivation for AI?"
    - "do you know if he has a repository about his AI journey ?"
    - "what's his plan for the next 6 months in AI"
    - "why AI?"
    - "making AI is his passion?"
    - "what is the list of programming languages he wants to learn"

  # Concrete things he has built: Manager, ai-journey, this bot.
  projects:
    # TODO: ~30 examples like "what have you built", "show me your work", "any projects"
    - "give me a project already done by him"
    - "list me his current projects"
    - "give me the link to his ai journey project"
    - "explain his ai journey project"
    - "what is the goal of his ai journey project"
    - "what is manager"
    - "what is his manager project"
    - "what is this bot built with"
    - "what is JobMatch project"
    - "what projects has he done"
    - "what projects has he built"
    - "explain his projects"
    - "any projects to show"
    - "what's his best project"
    - "what's the most impressive project he's done"
  # Technical skills: languages, frameworks, tools he actually knows.
  skills_tech:
    # TODO: ~30 examples like "what tech do you know", "do you code Python", "your stack"
    - "what programming languages does he master"
    - "he knows Python, right?"
    - "what libraries does he know?"
    - "stack?"
    - "languages?"
    - "frameworks?"
    - "tools?"
    - "list his technical skills"
    - "favorite programming language?"
    - "experience with JavaScript?"
    - "does he know React"
    - "familiar with machine learning frameworks?"
    - "any experience with TensorFlow or PyTorch?"
    - "on a scale from 1 to 10, how would you rate his Python skills?"
    - "you mentioned he's learning AI, does he have experience with data science tools?"
    - "what's his experience with cloud platforms like AWS or Azure?"
    - "does he have experience with Supabase?"

  # How to reach him: email, GitHub, LinkedIn.
  contact:
    # TODO: ~30 examples like "how do I reach you", "email", "where can I find your code"
    - "how can I contact him"
    - "what's his email"
    - "what's the best way to contact him"
    - "how can I get in touch with him"
    - "what's his LinkedIn"
    - "what's his GitHub"
    - "does he have a twitter (X) account?"
    - "can i have his Discord"
    - "can i have his email"
    - "give me his contact info"
    - "can u give me his contact info"
    - "links?"
    - "socials?"
    - "contact info?"
    - "email?"
    - "his github?"
    - "I want to reach out to him"
    - "I'd like to message him"
    - "how do I send him a message"
    - "does he have a personal website"
    - "any portfolio link"
    - "where's his resume"
    - "does he have a CV"
    - "any blog"
    - "I'm a recruiter and I'd like to discuss an opportunity with him, what's the fastest way to reach out?"
    # "send him a note from me" keep in mind j'aime bien l'idée 

  # Catch-all for everything outside the 9 trained intents.
  # COVER 12 CATEGORIES (see README / chat guide):
  # weather/time, math/calc, code requests, creative, news/politics,
  # meta-AI ("are you ChatGPT"), insults/spam, ultra-short ambiguous,
  # gibberish, personal off-scope, action requests, translation/linguistic.
  out_of_scope:
    # meteo
    - "what's the weather"
    - "is it sunny today"
    - "do I need an umbrella"
    - "what time is it"
    - "what's the date"
    - "what's the time in Tokyo"
    - "is it morning or evening"
    # awkward
    - "test"
    - "hello??"
    - "can you understand me"
    - "are you there"
    # math
    - "what's 2+2"
    - "what's the square root of 16"
    - "what's 10 divided by 2"
    # code
    - "write me a Python function that adds two numbers"
    - "show me how to use React"
    - "can you code a website for me"
    - "i want you to write a function?"
    - "lets debug this code"
    - "explain how to code an API"
    - "can you write a SQL query to select all users from a database"
    - "write a Python script"
    - "correct this code for me"
    # creative
    - "write a poem about the sea"
    - "tell me a joke"
    - "can you draw a cat"
    # news/politics
    - "what's the latest news"
    - "who's the president of the US"
    - "what's your opinion on climate change"
    # meta-AI
    - "are you ChatGPT"
    # insults / spam
    - "you suck"
    - "this bot is trash"
    - "shut up"
    # gibberish
    - "asdfasdf"
    - "blarghhh"
    - "zzzz"
    # personal off-scope
    - "is he single"
    - "what's his favorite movie"
    - "does he have a girlfriend"
    - "what religion is he"
    # action requests
    - "open his GitHub for me"
    - "send him an email saying hi"
    - "book a meeting with him"
    # translation / linguistic
    - "translate hello to Spanish"
    - "what does 'serendipity' mean"
    - "I was reading on Hacker News about how transformers scale, do you have an opinion on the latest research?"

  # Closing politeness after an answer.
  thanks:
    # ~22 examples — diversified so the model learns the *function*
    # (closing politely after an answer), not just the word "thanks".
    # thanks-variants
    - "thanks"
    - "thank you"
    - "thanks a lot"
    - "thank you so much"
    - "thanks a bunch"
    - "many thanks"
    - "thanks, that's helpful"
    - "thanks, that's exactly what I needed"
    # synonyms without "thanks"
    - "cheers"
    - "appreciate it"
    - "much appreciated"
    - "ty"
    - "thx"
    - "kudos"
    # positive feedback + implicit gratitude
    - "got it, that helps"
    - "perfect, that's what I needed"
    - "nice, that helps"
    - "great answer"
    - "noted, thanks"
    # compliment style
    - "you're a star"
    - "you rock"
    - "I owe you one"

  # End of conversation.
  goodbye:
    - "bye bye!"
    - "bye for now"
    - "bye now"
    - "bye!"
    - "bye-bye"
    - "goodbye"
    - "gbye"
    - "talk later"
    - "catch you later"
    - "I'm done"
    - "ciao"
    - "adios"
    - "see ya"
    - "see you"
    - "see you soon"
    - "see you later"
    # TODO: ~20-30 examples like "bye", "talk later", "I'm done"
