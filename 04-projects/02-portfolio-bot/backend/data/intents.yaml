# intents.yaml
#
# Training utterances grouped by intent.
# Target: ~30 examples per intent, balanced (+- 5 between classes).
# All examples in English. Mix lengths, registers, and forms.
#
# Tip: write as 4 different visitors would — recruiter, dev, admission officer, casual peer.

intents:

  # Opening / first contact.
  greet:
    # TODO: ~30 examples like "hi", "hey there", "yo", etc.
    - "hi"
    - "hey there"
    - "yo"
    - "hello"
    - "salutations"
    - "greetings"
    - "what's up"
    - "how's it going"
    - "welcome"
    - "hii"
    - "hey"
    - "hi there"
    - "good morning"
    - "good afternoon"
    - "good evening"
    - "hiya"
    - "hey hey"
    - "hello there"
    - "heyy"
    - "helo"
    - "sup"
    - "oi"
    - "howdy"
    - "hey, quick question"
    - "hi, got a sec?"
    # Chinese greetings reflecting Auxance's language skills and future plans(hesteregg).
    - "nǐ hǎo"
    - "wèi"
    - "nǐ hǎo ma?"
    - "zǎo shang hǎo"
  about_him:
    - "who is Auxance"
    - "tell me about him"
    - "what is his background"
    - "where is he from"
    - "is he a student"
    - "what does he do"
    - "give me a quick introduction"
    - "who is this guy"
    - "tell me more about Auxance"
    - "is he French"
    - "what are his goals"
    - "what are his ambitions"
    - "what are his plans for the future"
    - "who's he"
    - "what's his story?"
    - "intro?"
    - "how old is he"
    - "could you describe his profile"
    - "what school is he at"
    - "who are you talking about"

  current_focus:
    # TODO: ~30 examples like "what are you working on", "current focus", "what are you learning"
    - "what is his current project"
    - "what is he learning right now"
    - "what is his current focus"
    - "what is he working on"
    - "what are his current studies"
    - "what are his current learning goals"
    - "what are his current projects"
    - "what is he building right now"
    - "what's on his plate right now"
    - "what's his main focus at the moment"
    - "what's he up to these days"
    - "what's he working on these days"
    - "what's he learning these days"
    - "what's his main project right now"
    - "what's his main learning focus right now"

  # The long-term picture: why AI, target school, the journey, motivation.
  ai_journey:
    - "what are his current studies plans"
    - "what are his current studies goals"
    - "for what reason he want to do a doctorate in China"
    - "what school does he want to go to"
    - "what studies level does he want to reach"
    - "what's his long-term plan"
    - "describe his AI journey"
    - "what's his motivation for studying AI"
    - "how long has his AI journey been going"
    - "ai journey, tell me more"
    - "why is he doing all this"
    - "what's his long-term vision in AI"
    - "where is he headed"
    - "what's his target university"
    - "why china"

  # Concrete things he has built: Manager, ai-journey, this bot.
  projects:
    # TODO: ~30 examples like "what have you built", "show me your work", "any projects"
    - "give me a project already done by him"
    - "list me his current projects"
    - "give me the link to his ai journey project"
    - "explain his ai journey project"
    - "what is the goal of his ai journey project"
  # Technical skills: languages, frameworks, tools he actually knows.
  skills_tech:
    # TODO: ~30 examples like "what tech do you know", "do you code Python", "your stack"

  # How to reach him: email, GitHub, LinkedIn.
  contact:
    # TODO: ~30 examples like "how do I reach you", "email", "where can I find your code"

  # Catch-all for everything outside the 9 trained intents.
  # COVER 12 CATEGORIES (see README / chat guide):
  # weather/time, math/calc, code requests, creative, news/politics,
  # meta-AI ("are you ChatGPT"), insults/spam, ultra-short ambiguous,
  # gibberish, personal off-scope, action requests, translation/linguistic.
  out_of_scope:
    # meteo
    - "what's the weather"
    - "is it sunny today"
    - "do I need an umbrella"
    - "what time is it"
    - "what's the date"
    - "what's the time in Tokyo"
    - "is it morning or evening"
    # awkward
    - "test"
    - "hello??"
    - "can you understand me"
    - "are you there"
    # math
    - "what's 2+2"
    - "what's the square root of 16"
    - "what's 10 divided by 2"
    # code
    - "write me a Python function that adds two numbers"
    - "show me how to use React"
    - "can you code a website for me"
    # creative
    - "write a poem about the sea"
    - "tell me a joke"
    - "can you draw a cat"
    # news/politics
    - "what's the latest news"
    - "who's the president of the US"
    - "what's your opinion on climate change"
    # meta-AI
    - "are you ChatGPT"
  # Closing politeness after an answer.
  thanks:
    # TODO: ~20-30 examples like "thanks", "cheers", "appreciate it"

  # End of conversation.
  goodbye:
    # TODO: ~20-30 examples like "bye", "talk later", "I'm done"
